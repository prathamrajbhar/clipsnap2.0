<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6E38"/>
      <stop offset="100%" stop-color="#E95420"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#383838"/>
      <stop offset="100%" stop-color="#242424"/>
    </linearGradient>
  </defs>

  <!-- Base App Tile with Ubuntu rounded corners -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#bgGrad)" stroke="#4A4A4A" stroke-width="2"/>

  <!-- Clipboard Board Body -->
  <rect x="28" y="32" width="72" height="74" rx="8" ry="8" fill="#2E2E2E" stroke="#505050" stroke-width="2"/>
  
  <!-- Clipboard Top Clip -->
  <rect x="46" y="24" width="36" height="16" rx="5" ry="5" fill="url(#orangeGrad)"/>
  <circle cx="64" cy="30" r="3.5" fill="#242424"/>

  <!-- Paper/Content surface -->
  <rect x="36" y="44" width="56" height="52" rx="4" ry="4" fill="#FFFFFF" opacity="0.95"/>

  <!-- Snippet lines -->
  <line x1="44" y1="56" x2="72" y2="56" stroke="#E95420" stroke-width="3" stroke-linecap="round"/>
  <line x1="44" y1="66" x2="84" y2="66" stroke="#555555" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="74" x2="78" y2="74" stroke="#777777" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="44" y1="82" x2="68" y2="82" stroke="#999999" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Snipping / Camera Focus Reticle on Bottom Right -->
  <circle cx="94" cy="94" r="18" fill="url(#orangeGrad)" stroke="#242424" stroke-width="3"/>
  <path d="M 88 88 L 88 92 M 88 88 L 92 88 M 100 88 L 100 92 M 100 88 L 96 88 M 88 100 L 88 96 M 88 100 L 92 100 M 100 100 L 100 96 M 100 100 L 96 100" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="94" cy="94" r="2" fill="#FFFFFF"/>
</svg>
